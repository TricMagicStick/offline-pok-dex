<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉDEX • Offline</title>
    <link rel="stylesheet" href="css/pokedex.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="pokedex-container">
        <div class="pokedex-header">
            <div>
                <h1>POKÉDEX</h1>
                <div style="font-size: 8px; opacity: 0.85; margin-top: -2px;">OFFLINE • v3.5.0 • Phase 1</div>
            </div>
            <div style="display: flex; gap: 7px; align-items: center;">
                <button id="random-btn" class="nav-btn" style="font-size:10px; padding:4px 9px;">🎲 Random</button>
            </div>
        </div>

        <div class="main-content">
            <div class="split-container">
                <div class="viewer-panel">
                    <img id="viewer-sprite" class="viewer-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Bulbasaur">
                    <div id="viewer-name" class="viewer-name">Bulbasaur</div>
                    <div id="viewer-types" class="viewer-types"></div>
                </div>

                <div class="list-panel">
                    <div class="list-header">
                        <span>National Pokédex (151)</span>
                        <div style="display: flex; gap: 5px;">
                            <button id="toggle-filter" class="filter-toggle">🔍 Search / Filter</button>
                        </div>
                    </div>
                    <div id="filter-section" class="filter-section">
                        <input type="text" id="search-input" class="search-input" placeholder="Search name or #...">
                        <div class="type-filters" id="type-filters"></div>
                    </div>
                    <div id="pokemon-list" class="scrollable-list"></div>
                </div>
            </div>
        </div>

        <div class="footer">Offline Pokédex • v3.5.0 • Phase 1</div>
    </div>

    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="nav-buttons">
                    <button id="prev-btn" class="nav-btn">← Prev</button>
                    <button id="next-btn" class="nav-btn">Next →</button>
                </div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="gen-tab-bar" class="gen-tab-bar" style="display: none;">
                    <div id="tab-gen1" class="gen-tab active" onclick="switchGeneration('1')">Gen 1</div>
                    <div id="tab-gen2" class="gen-tab placeholder" onclick="switchGeneration('2')">Gen 2 (Placeholder)</div>
                </div>
                
                <img id="modal-sprite" class="detail-sprite" alt="">
                <div id="modal-types" style="display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; flex-wrap: wrap;"></div>
                <div><div class="section-title">ABILITIES</div><div id="modal-abilities" style="display: flex; flex-wrap: wrap; gap: 3px; font-size: 11px;"></div></div>
                <div><div class="section-title">BASE STATS</div><div class="stats-grid" id="modal-stats"></div></div>
                <div><div class="section-title">TYPE EFFECTIVENESS</div><div class="effectiveness-grid" id="modal-effectiveness"></div></div>
                <div><div class="section-title">POKÉDEX ENTRY</div><div class="pokedex-entry" id="modal-entry"></div></div>
                <div class="move-section"><div class="section-title">LEVEL-UP MOVES</div><div id="modal-moves-levelup" class="moves-container"></div></div>
                <div class="move-section"><div class="section-title">TM MOVES</div><div id="modal-moves-tm" class="moves-container"></div></div>
                <div class="move-section"><div class="section-title">EGG MOVES</div><div id="modal-moves-egg" class="moves-container"></div></div>
            </div>
        </div>
    </div>

    <!-- Load data first -->
    <script src="js/data.js"></script>

    <script>
        // All other JavaScript logic remains inline for now (will be moved in later phases)
        function getPokemonData(pokemon, gen = "1") {
            if (pokemon.generations && pokemon.generations[gen]) {
                const g = pokemon.generations[gen];
                return { sprite: g.sprite, base_stats: g.base_stats, entry: g.entry, moves: g.moves };
            } else if (pokemon.generations && pokemon.generations["1"]) {
                const g = pokemon.generations["1"];
                return { sprite: g.sprite, base_stats: g.base_stats, entry: g.entry, moves: g.moves };
            } else {
                return { sprite: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png`, base_stats: pokemon.base_stats, entry: pokemon.entry, moves: pokemon.moves };
            }
        }

        function isPhase1TestPokemon(nationalDex) {
            return [1, 2, 3].includes(nationalDex);
        }

</body>
</html>
