            'Flying':   { weak: ['Electric','Ice','Rock'], resist: ['Grass','Fighting','Bug'], immune: ['Ground'] },
            'Psychic':  { weak: ['Bug','Ghost','Dark'], resist: ['Fighting','Psychic'], immune: [] },
            'Bug':      { weak: ['Fire','Flying','Rock'], resist: ['Grass','Fighting','Ground'], immune: [] },
            'Rock':     { weak: ['Water','Grass','Fighting','Ground','Steel'], resist: ['Normal','Fire','Poison','Flying'], immune: [] },
            'Ghost':    { weak: ['Ghost','Dark'], resist: ['Poison','Bug'], immune: ['Normal','Fighting'] },
            'Dragon':   { weak: ['Ice','Dragon','Fairy'], resist: ['Fire','Water','Grass','Electric'], immune: [] },
            'Dark':     { weak: ['Fighting','Bug','Fairy'], resist: ['Ghost','Dark'], immune: ['Psychic'] },
            'Steel':    { weak: ['Fire','Fighting','Ground'], resist: ['Normal','Grass','Ice','Flying','Psychic','Bug','Rock','Dragon','Steel','Fairy'], immune: ['Poison'] },
            'Fairy':    { weak: ['Poison','Steel'], resist: ['Fighting','Bug','Dark'], immune: ['Dragon'] }
        };

        function getTypeEffectiveness(types) {
            let weak = new Set();
            let resist = new Set();
            let immune = new Set();
            types.forEach(type => {
                const eff = typeEffectiveness[type];
                if (!eff) return;
                eff.weak.forEach(t => weak.add(t));
                eff.resist.forEach(t => resist.add(t));
                eff.immune.forEach(t => immune.add(t));
            });
            immune.forEach(t => { resist.delete(t); weak.delete(t); });
            resist.forEach(t => weak.delete(t));
            return { weak: Array.from(weak), resist: Array.from(resist), immune: Array.from(immune) };
        }

        let currentFilters = { search: '', types: [] };
        let allPokemon = [...pokemonData];
        let currentSelectedPokemon = null;
        let currentModalGeneration = "1";
        let touchStartY = 0;
        let touchStartTime = 0;
        let touchMoved = false;

        function filterAndRender() {
            let filtered = allPokemon;
            const searchTerm = currentFilters.search.toLowerCase().trim();
            if (searchTerm) { filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm) || p.national_dex.toString().includes(searchTerm)); }
            if (currentFilters.types.length > 0) { filtered = filtered.filter(p => currentFilters.types.every(t => p.types.includes(t))); }
            renderList(filtered);
        }

        function updateViewer(pokemon) {
            if (!pokemon) return;
            currentSelectedPokemon = pokemon;
            const data = getPokemonData(pokemon, "1");
            
            const spriteEl = document.getElementById('viewer-sprite');
            if (spriteEl) { spriteEl.src = data.sprite; spriteEl.alt = pokemon.name; }
            
            const nameEl = document.getElementById('viewer-name');
            if (nameEl) nameEl.textContent = pokemon.name;
            
            const typesContainer = document.getElementById('viewer-types');
            if (typesContainer) { typesContainer.innerHTML = pokemon.types.map(type => `<span style="background-color: ${typeColors[type] || '#64748B'}; color: white; padding: 2px 9px; border-radius: 5px; font-size: 11px;">${type}</span>`).join(''); }
            
            document.querySelectorAll('.pokemon-list-item').forEach(el => { el.classList.remove('selected'); if (parseInt(el.dataset.dex) === pokemon.national_dex) el.classList.add('selected'); });
        }

        function renderList(pokemonList) {
            const container = document.getElementById('pokemon-list');
            if (!container) return;
            container.innerHTML = '';
            if (!pokemonList || pokemonList.length === 0) { container.innerHTML = '<div style="padding: 20px 10px; text-align: center; color: #64748B; font-size: 11px;">No Pokémon found.</div>'; return; }
            
            for (let i = 0; i < 2; i++) {
                const spacer = document.createElement('div');
                spacer.className = 'pokemon-list-item invisible-spacer';
                spacer.style.height = '68px';
                spacer.style.opacity = '0';
                spacer.style.pointerEvents = 'none';
                container.appendChild(spacer);
            }
            
            pokemonList.forEach(pokemon => {
                const item = document.createElement('div');
                item.className = 'pokemon-list-item';
                item.dataset.dex = pokemon.national_dex;
                let typesHTML = pokemon.types.map(type => `<span style="background-color: ${typeColors[type] || '#64748B'}; color: white; padding: 0 5px; border-radius: 3px; font-size: 9px;">${type}</span>`).join('');
                item.innerHTML = `<img class="list-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png" alt="${pokemon.name}" onerror="this.style.display='none'"><div class="list-info"><div style="display: flex; align-items: center; gap: 5px;"><span style="font-family: 'Press Start 2P', system-ui; font-size: 9px; color: #64748B;">#${String(pokemon.national_dex).padStart(3, '0')}</span><span class="list-name">${pokemon.name}</span></div><div class="list-types" style="margin-top: 3px;">${typesHTML}</div></div>`;
                
                item.addEventListener('touchstart', function(e) {
                    touchStartY = e.touches[0].clientY;
                    touchStartTime = Date.now();
                    touchMoved = false;
                }, { passive: true });
                
                item.addEventListener('touchmove', function(e) {
                    const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
                    if (deltaY > 12) touchMoved = true;
                }, { passive: true });
                
                const handleTap = function(e) {
                    const timeDiff = Date.now() - touchStartTime;
                    if (touchMoved || timeDiff > 450) return;
                    if (e) { e.preventDefault(); e.stopImmediatePropagation(); }
                    item.classList.add('tapped');
                    setTimeout(() => item.classList.remove('tapped'), 220);
                    updateViewer(pokemon);
                    setTimeout(() => { showDetail(pokemon); }, 50);
                };
                
                item.addEventListener('click', handleTap, { passive: false });
                item.addEventListener('touchend', handleTap, { passive: false });
                item.addEventListener('pointerup', handleTap, { passive: false });
                container.appendChild(item);
            });
            
            for (let i = 0; i < 3; i++) {
                const spacer = document.createElement('div');
                spacer.className = 'pokemon-list-item invisible-spacer';
                spacer.style.height = '68px';
                spacer.style.opacity = '0';
                spacer.style.pointerEvents = 'none';
                container.appendChild(spacer);
            }
            
            if (currentSelectedPokemon) {
                const selectedEl = container.querySelector(`[data-dex="${currentSelectedPokemon.national_dex}"]`);
                if (selectedEl) selectedEl.classList.add('selected');
            }
        }

        function switchGeneration(gen) {
            if (!currentSelectedPokemon) return;
            currentModalGeneration = gen;
            
            // Update tab active states
            document.getElementById('tab-gen1').classList.toggle('active', gen === '1');
            document.getElementById('tab-gen2').classList.toggle('active', gen === '2');
            
            // Re-render modal content with selected generation
            const modal = document.getElementById('detail-modal');
            if (modal) {
                showDetail(currentSelectedPokemon, gen);
            }
        }

        function showDetail(pokemon, forceGen = null) {
            const modal = document.getElementById('detail-modal');
            if (!modal) return;
            modal.dataset.currentDex = pokemon.national_dex;
            
            const gen = forceGen || currentModalGeneration || "1";
            currentModalGeneration = gen;
            
            const data = getPokemonData(pokemon, gen);
            
            const genTabBar = document.getElementById('gen-tab-bar');
            if (genTabBar) {
                if (isPhase1TestPokemon(pokemon.national_dex)) {
                    genTabBar.style.display = 'flex';
                    // Update active tab
                    document.getElementById('tab-gen1').classList.toggle('active', gen === '1');
                    document.getElementById('tab-gen2').classList.toggle('active', gen === '2');
                } else {
                    genTabBar.style.display = 'none';
                }
            }
            
            const sprite = document.getElementById('modal-sprite');
            if (sprite) { sprite.src = data.sprite; sprite.alt = pokemon.name; }
            
            const typesContainer = document.getElementById('modal-types');
            if (typesContainer) { typesContainer.innerHTML = pokemon.types.map(type => `<span style="background-color: ${typeColors[type] || '#64748B'}; color: white; padding: 2px 10px; border-radius: 4px; font-size: 11px;">${type}</span>`).join(''); }
            
            const abilitiesContainer = document.getElementById('modal-abilities');
            if (abilitiesContainer) { abilitiesContainer.innerHTML = pokemon.abilities.map(ability => `<span style="background:#0F172A; padding:2px 8px; border-radius:4px; font-size:12px;">${ability}</span>`).join(''); }
            
            const statsContainer = document.getElementById('modal-stats');
            if (statsContainer) { statsContainer.innerHTML = ''; const statNames = { hp: 'HP', attack: 'Attack', defense: 'Defense', special_attack: 'Sp. Atk', special_defense: 'Sp. Def', speed: 'Speed' }; Object.keys(data.base_stats).forEach(statKey => { const value = data.base_stats[statKey]; const percentage = Math.min((value / 180) * 100, 100); const row = document.createElement('div'); row.className = 'stat-row'; row.innerHTML = `<div class="stat-label">${statNames[statKey]}</div><div class="stat-bar-container"><div class="stat-bar" style="width: ${percentage}%"></div></div><div class="stat-value">${value}</div>`; statsContainer.appendChild(row); }); }
            
            const effContainer = document.getElementById('modal-effectiveness');
            if (effContainer) {
                effContainer.innerHTML = '';
                const eff = getTypeEffectiveness(pokemon.types);
                const createEffectBox = (title, typesList) => {
                    const box = document.createElement('div');
                    box.className = 'effect-box';
                    let pills = typesList.length > 0 
                        ? typesList.map(t => `<span class="effect-pill" style="background-color: ${typeColors[t] || '#64748B'}">${t}</span>`).join('')
                        : '<span style="color:#64748B; font-size:11px;">None</span>';
                    box.innerHTML = `<div class="effect-title">${title}</div><div class="effect-pills">${pills}</div>`;
                    return box;
                };
                effContainer.appendChild(createEffectBox('WEAK TO', eff.weak));
                effContainer.appendChild(createEffectBox('RESISTS', eff.resist));
                effContainer.appendChild(createEffectBox('IMMUNE TO', eff.immune));
            }
            
            const entryContainer = document.getElementById('modal-entry');
            if (entryContainer) { entryContainer.textContent = data.entry || 'Pokédex entry coming soon.'; }
            
            const levelupContainer = document.getElementById('modal-moves-levelup');
            if (levelupContainer) { levelupContainer.innerHTML = (data.moves && data.moves.level_up && data.moves.level_up.length > 0) ? data.moves.level_up.map(m => `<span style="display:inline-block; background:#1E2937; margin:2px 3px; padding:2px 7px; border-radius:4px; font-size:11px;">Lv${m.level} ${m.name}</span>`).join('') : '<span style="color:#64748B; font-size:11px;">No level-up moves.</span>'; }
            
            const tmContainer = document.getElementById('modal-moves-tm');
            if (tmContainer) { tmContainer.innerHTML = (data.moves && data.moves.tm && data.moves.tm.length > 0) ? data.moves.tm.map(move => `<span style="display:inline-block; background:#1E2937; margin:2px 3px; padding:2px 7px; border-radius:4px; font-size:11px;">${move}</span>`).join('') : '<span style="color:#64748B; font-size:11px;">No TM data yet.</span>'; }
            
            const eggContainer = document.getElementById('modal-moves-egg');
            if (eggContainer) { eggContainer.innerHTML = (data.moves && data.moves.egg && data.moves.egg.length > 0) ? data.moves.egg.map(move => `<span style="display:inline-block; background:#1E2937; margin:2px 3px; padding:2px 7px; border-radius:4px; font-size:11px;">${move}</span>`).join('') : '<span style="color:#64748B; font-size:11px;">No egg moves.</span>'; }
            
            document.body.style.overflow = 'hidden';
            modal.style.display = 'flex';
            void modal.offsetHeight;
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('active');
            modal.style.display = 'none';
            document.body.style.overflow = '';
            currentModalGeneration = "1";
        }

        function showRandomPokemon() {
            const randomIndex = Math.floor(Math.random() * allPokemon.length);
            const randomPokemon = allPokemon[randomIndex];
            updateViewer(randomPokemon);
            showDetail(randomPokemon);
        }

        function init() {
            const toggleBtn = document.getElementById('toggle-filter');
            if (toggleBtn) toggleBtn.addEventListener('click', () => { const section = document.getElementById('filter-section'); if (section) section.classList.toggle('open'); });
            
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.addEventListener('input', e => { currentFilters.search = e.target.value; filterAndRender(); });
            
            const randomBtn = document.getElementById('random-btn');
            if (randomBtn) randomBtn.addEventListener('click', showRandomPokemon);
            
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            if (prevBtn) prevBtn.addEventListener('click', () => { /* nav */ });
            if (nextBtn) nextBtn.addEventListener('click', () => { /* nav */ });
            
            const modal = document.getElementById('detail-modal');
            if (modal) modal.addEventListener('click', e => { if (e.target.id === 'detail-modal') closeModal(); });
            
            setTimeout(() => {
                filterAndRender();
                const bulbasaur = allPokemon.find(p => p.national_dex === 1);
                if (bulbasaur) updateViewer(bulbasaur);
            }, 80);
            
            const listContainer = document.getElementById('pokemon-list');
            if (listContainer) {
                let rafId = null;
                listContainer.addEventListener('scroll', () => {
                    if (rafId) cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(() => {
                        const items = listContainer.querySelectorAll('.pokemon-list-item');
                        if (items.length === 0) return;
                        const containerRect = listContainer.getBoundingClientRect();
                        const centerY = containerRect.top + containerRect.height / 2;
                        let closest = null;
                        let closestDist = Infinity;
                        items.forEach(el => {
                            const r = el.getBoundingClientRect();
                            const dist = Math.abs((r.top + r.height / 2) - centerY);
                            if (dist < closestDist) { closestDist = dist; closest = el; }
                        });
                        if (closest) {
                            const dex = parseInt(closest.dataset.dex);
                            const p = allPokemon.find(x => x.national_dex === dex);
                            if (p && p !== currentSelectedPokemon) { updateViewer(p); }
                        }
                    });
                }, { passive: true });
            }
            
            console.log('%c[v3.0.2] Functional Gen 1 / Gen 2 tabs implemented for test Pokémon.', 'color:#22C55E');
        }

        window.onload = init;
    </script>
</body>
</html>
