<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉDEX • Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        :root {
            --pokedex-red: #C8102E;
            --pokedex-dark-red: #8B0000;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(#8B0000, #5C0000);
            color: #F1F5F9;
            min-height: 100vh;
            padding: 20px;
        }
        
        .pokedex-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #111827;
            border: 8px solid #C8102E;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            overflow: hidden;
        }
        
        .pokedex-header {
            background: linear-gradient(#C8102E, #8B0000);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 6px solid #5C0000;
        }
        
        .pokedex-header h1 {
            font-family: "Press Start 2P", system-ui;
            font-size: 26px;
            letter-spacing: 2px;
            color: white;
            text-shadow: 3px 3px 0 #5C0000;
        }
        
        .search-container {
            position: relative;
            width: 300px;
        }
        
        .search-input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border: none;
            border-radius: 9999px;
            background: #1E2937;
            color: white;
            font-size: 15px;
            outline: none;
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748B;
        }
        
        .main-content {
            padding: 24px;
            background: #0F172A;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #334155;
        }
        
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .type-pill {
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
            user-select: none;
        }
        
        .type-pill.active {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
        }
        
        .sort-select {
            background: #1E2937;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .pokemon-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .pokemon-list-item {
            display: flex;
            align-items: center;
            background: #1E2937;
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            border: 2px solid #334155;
        }
        
        .pokemon-list-item:hover {
            background: #273549;
            transform: translateX(4px);
            border-color: #C8102E;
        }
        
        .list-sprite {
            width: 56px;
            height: 56px;
            margin-right: 16px;
            flex-shrink: 0;
            image-rendering: crisp-edges;
        }
        
        .list-main {
            flex: 1;
            min-width: 0;
        }
        
        .list-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2px;
        }
        
        .list-dex {
            font-family: "Press Start 2P", system-ui;
            font-size: 12px;
            color: #64748B;
            min-width: 42px;
        }
        
        .list-name {
            font-size: 17px;
            font-weight: 700;
            color: white;
        }
        
        .list-types {
            display: flex;
            gap: 6px;
        }
        
        .list-ability {
            font-size: 13px;
            color: #94A3B8;
            margin-top: 2px;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #1E2937;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            border: 6px solid #C8102E;
        }
        
        .modal-header {
            background: linear-gradient(#C8102E, #8B0000);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .detail-sprite {
            width: 140px;
            height: 140px;
            margin: 0 auto 16px;
            display: block;
            image-rendering: crisp-edges;
        }
        
        .stats-grid {
            display: grid;
            gap: 8px;
            margin: 16px 0;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .stat-label {
            width: 80px;
            font-size: 13px;
            font-weight: 600;
            color: #CBD5E1;
        }
        
        .stat-bar-container {
            flex: 1;
            background: #334155;
            height: 12px;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .stat-bar {
            height: 100%;
            background: linear-gradient(to right, #C8102E, #EF4444);
        }
        
        .stat-value {
            width: 36px;
            text-align: right;
            font-weight: 700;
            font-size: 13px;
        }
        
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #C8102E;
            margin: 20px 0 8px;
            letter-spacing: 0.5px;
        }
        
        .placeholder-box {
            background: #0F172A;
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            color: #64748B;
            font-size: 13px;
        }
        
        .footer {
            padding: 14px 24px;
            background: #111827;
            font-size: 12px;
            color: #64748B;
            text-align: center;
            border-top: 1px solid #334155;
        }
        
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #64748B;
        }
    </style>
</head>
<body>
    <div class="pokedex-container">
        <!-- Header -->
        <div class="pokedex-header">
            <div>
                <h1>POKÉDEX</h1>
                <div style="font-size: 11px; opacity: 0.8; margin-top: -4px;">OFFLINE • v1.5.01 • Full 151</div>
            </div>
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" class="search-input" placeholder="Search name or #...">
            </div>
        </div>

        <div class="main-content">
            <!-- Controls -->
            <div class="controls">
                <div>
                    <div style="font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600;">FILTER BY TYPE</div>
                    <div class="filter-group" id="type-filters"></div>
                </div>
                
                <div style="margin-left: auto;">
                    <div style="font-size: 11px; color: #64748B; margin-bottom: 6px; font-weight: 600;">SORT</div>
                    <select id="sort-select" class="sort-select">
                        <option value="dex-asc">National Dex ↑</option>
                        <option value="dex-desc">National Dex ↓</option>
                        <option value="name-asc">Name A-Z</option>
                        <option value="name-desc">Name Z-A</option>
                    </select>
                </div>
            </div>

            <!-- List -->
            <div id="pokemon-list" class="pokemon-list"></div>
            
            <div id="no-results" class="no-results" style="display: none;">
                <p>No Pokémon found.</p>
                <button onclick="resetFilters()" style="margin-top: 12px; background: #C8102E; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">Clear Filters</button>
            </div>
        </div>

        <div class="footer">
            Offline Pokédex • v1.5.01 • Full Gen 1 (151) • Pokédex entries #16–32 + contrast fix • More coming
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal" onclick="if (event.target.id === 'detail-modal') closeModal()">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <span id="modal-dex" style="font-family: 'Press Start 2P', system-ui; font-size: 13px; opacity: 0.9;"></span>
                    <h2 id="modal-name" style="margin-top: 2px; font-size: 22px;"></h2>
                </div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <img id="modal-sprite" class="detail-sprite" alt="">
                
                <div id="modal-types" style="display: flex; justify-content: center; gap: 8px; margin-bottom: 16px;"></div>
                
                <div>
                    <div class="section-title">ABILITIES</div>
                    <div id="modal-abilities" style="display: flex; flex-wrap: wrap; gap: 6px;"></div>
                </div>
                
                <div>

                    <div class="stats-grid" id="modal-stats"></div>
                </div>
                
                <div>
                    <div class="section-title">POKÉDEX ENTRY</div>
                    <div class="placeholder-box" id="modal-entry">

                    </div>
                </div>
            </div>
        </div>
    </div>

            'Water': '#3B82F6', 'Bug': '#84CC16', 'Normal': '#A3A3A3', 'Electric': '#EAB308',
            'Ground': '#CA8A04', 'Rock': '#78716C', 'Fighting': '#F97316', 'Psychic': '#EC4899',
            'Ghost': '#6366F1', 'Ice': '#67E8F9', 'Dragon': '#8B5CF6', 'Dark': '#334155',
            'Steel': '#71717A', 'Fairy': '#F472B6'
        };

        let currentFilters = { types: [], search: '', sort: 'dex-asc' };
        let allPokemon = [...pokemonData];

        function renderTypeFilters() {
            const container = document.getElementById('type-filters');
            const allTypes = [...new Set(allPokemon.flatMap(p => p.types))].sort();
            container.innerHTML = '';
            
            allTypes.forEach(type => {
                const pill = document.createElement('div');
                pill.className = 'type-pill';
                pill.style.backgroundColor = typeColors[type] || '#64748B';
                pill.style.color = 'white';
                pill.textContent = type;
                pill.dataset.type = type;
                
                pill.addEventListener('click', () => {
                    if (currentFilters.types.includes(type)) {
                        currentFilters.types = currentFilters.types.filter(t => t !== type);
                        pill.classList.remove('active');
                    } else {
                        currentFilters.types.push(type);
                        pill.classList.add('active');
                    }
                    filterAndRender();
                });
                container.appendChild(pill);
            });
        }

        function filterAndRender() {
            let filtered = allPokemon;
            
            const searchTerm = currentFilters.search.toLowerCase().trim();
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) || 
                    p.national_dex.toString().includes(searchTerm)
                );
            }
            
            if (currentFilters.types.length > 0) {
                filtered = filtered.filter(p => currentFilters.types.every(t => p.types.includes(t)));
            }
            
            const sortMode = currentFilters.sort;
            if (sortMode === 'dex-asc') filtered.sort((a, b) => a.national_dex - b.national_dex);
            else if (sortMode === 'dex-desc') filtered.sort((a, b) => b.national_dex - a.national_dex);
            else if (sortMode === 'name-asc') filtered.sort((a, b) => a.name.localeCompare(b.name));
            else if (sortMode === 'name-desc') filtered.sort((a, b) => b.name.localeCompare(a.name));
            
            renderList(filtered);
        }

        function renderList(pokemonList) {
            const container = document.getElementById('pokemon-list');
            const noResults = document.getElementById('no-results');
            container.innerHTML = '';
            
            if (pokemonList.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }
            
            pokemonList.forEach(pokemon => {
                const item = document.createElement('div');
                item.className = 'pokemon-list-item';
                
                let typesHTML = pokemon.types.map(type => 
                    `<span class="type-badge" style="background-color: ${typeColors[type] || '#64748B'}">${type}</span>`
                ).join('');
                
                item.innerHTML = `
                    <img class="list-sprite" 
                         src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png" 
                         alt="${pokemon.name}"
                         onerror="this.style.display='none'">
                    <div class="list-main">
                        <div class="list-header">
                            <div class="list-dex">#${String(pokemon.national_dex).padStart(3, '0')}</div>
                            <div class="list-name">${pokemon.name}</div>
                        </div>
                        <div class="list-types">${typesHTML}</div>
                        <div class="list-ability">${pokemon.abilities[0]}</div>
                    </div>
                `;
                
                item.addEventListener('click', () => showDetail(pokemon));
                container.appendChild(item);
            });
        }

        function showDetail(pokemon) {
            const modal = document.getElementById('detail-modal');
            
            document.getElementById('modal-dex').textContent = `#${String(pokemon.national_dex).padStart(3, '0')}`;
            document.getElementById('modal-name').textContent = pokemon.name;
            
            const sprite = document.getElementById('modal-sprite');
            sprite.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png`;
            sprite.alt = pokemon.name;
            
            const typesContainer = document.getElementById('modal-types');
            typesContainer.innerHTML = pokemon.types.map(type => 
                `<span class="type-badge" style="background-color: ${typeColors[type] || '#64748B'}; padding: 4px 14px; font-size: 13px;">${type}</span>`
            ).join('');
            
            const abilitiesContainer = document.getElementById('modal-abilities');
            abilitiesContainer.innerHTML = pokemon.abilities.map(ability => 
                `<span style="background:#0F172A; padding:4px 10px; border-radius:6px; font-size:13px;">${ability}</span>`
            ).join('');
            
            const statsContainer = document.getElementById('modal-stats');
            statsContainer.innerHTML = '';
            
            const statNames = { hp: 'HP', attack: 'Attack', defense: 'Defense', special_attack: 'Sp. Atk', special_defense: 'Sp. Def', speed: 'Speed' };
            
            Object.keys(pokemon.base_stats).forEach(statKey => {
                const value = pokemon.base_stats[statKey];
                const percentage = Math.min((value / 180) * 100, 100);
                
                const row = document.createElement('div');
                row.className = 'stat-row';
                row.innerHTML = `
                    <div class="stat-label">${statNames[statKey]}</div>
                    <div class="stat-bar-container">
                        <div class="stat-bar" style="width: ${percentage}%"></div>
                    </div>
                    <div class="stat-value">${value}</div>
                `;
                statsContainer.appendChild(row);
            });
            
            const movesContainer = document.getElementById('modal-moves');
            if (pokemon.moves && pokemon.moves.level_up && pokemon.moves.level_up.length > 0) {
                movesContainer.innerHTML = pokemon.moves.level_up.map(m => 
                    `<span style="display:inline-block; background:#1E2937; margin:2px; padding:2px 8px; border-radius:4px;">Lv${m.level} ${m.name}</span>`
                ).join('');
            } else {
                movesContainer.innerHTML = '<span style="color:#64748B;">No move data yet for this Pokémon.</span>';
            }
            
            const entryContainer = document.getElementById('modal-entry');
            if (pokemon.entry) {
                entryContainer.innerHTML = pokemon.entry;
                entryContainer.style.border = '1px solid #475569';
                entryContainer.style.textAlign = 'left';
                entryContainer.style.color = '#F1F5F9';
                entryContainer.style.fontSize = '14px';
                entryContainer.style.lineHeight = '1.5';
            } else {
                entryContainer.innerHTML = 'Pokédex entry coming soon.';
            }
            
            document.body.style.overflow = 'hidden';
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function resetFilters() {
            currentFilters.types = [];
            currentFilters.search = '';
            document.getElementById('search-input').value = '';
            document.querySelectorAll('#type-filters .type-pill').forEach(p => p.classList.remove('active'));
            filterAndRender();
        }

        function init() {
            renderTypeFilters();
            renderList(allPokemon);
            
            const searchInput = document.getElementById('search-input');
            searchInput.addEventListener('input', e => {
                currentFilters.search = e.target.value;
                filterAndRender();
            });
            
            const sortSelect = document.getElementById('sort-select');
            sortSelect.addEventListener('change', e => {
                currentFilters.sort = e.target.value;
                filterAndRender();
            });
            
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    const modal = document.getElementById('detail-modal');
                    if (modal.classList.contains('active')) modal.classList.remove('active');
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
