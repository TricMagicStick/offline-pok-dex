<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉDEX • Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(#8B0000, #5C0000);
            color: #F1F5F9;
            min-height: 100vh;
            padding: 8px;
        }
        
        .pokedex-container {
            max-width: 1080px;
            margin: 0 auto;
            background: #111827;
            border: 8px solid #C8102E;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 96vh;
        }
        
        .pokedex-header {
            background: linear-gradient(#C8102E, #8B0000);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 6px solid #5C0000;
            flex-shrink: 0;
        }
        
        .pokedex-header h1 {
            font-family: "Press Start 2P", system-ui;
            font-size: 20px;
            letter-spacing: 2px;
            color: white;
            text-shadow: 3px 3px 0 #5C0000;
        }
        
        .main-content {
            padding: 10px;
            background: #0F172A;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .split-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        
        @media (max-width: 640px) {
            .split-container {
                flex-direction: column;
                gap: 8px;
            }
        }

        .viewer-panel {
            background: #1E2937;
            border-radius: 12px;
            border: 2px solid #334155;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1 1 45%;
            min-width: 0;
            overflow-y: auto;
            min-height: 185px;
        }

        @media (max-width: 640px) {
            .viewer-panel {
                flex: 0 0 270px;
                min-height: 270px;
                padding: 8px 6px;
            }
        }

        .viewer-sprite {
            width: 148px;
            height: 148px;
            margin: 0 0 2px;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }

        .viewer-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 2px;
            line-height: 1.05;
        }

        .viewer-types {
            display: flex;
            gap: 5px;
            margin-bottom: 2px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .list-panel {
            background: #1E2937;
            border-radius: 12px;
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1 1 55%;
            min-width: 0;
            position: relative;
        }

        @media (max-width: 640px) {
            .list-panel {
                flex: 1 1 auto;
                min-height: 0;
            }
        }

        .list-header {
            padding: 9px 12px;
            background: #111827;
            font-weight: 600;
            font-size: 12px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-toggle {
            background: #1E2937;
            border: 1px solid #475569;
            color: #CBD5E1;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-toggle:hover {
            border-color: #C8102E;
        }

        .filter-section {
            padding: 7px 11px;
            background: #111827;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            z-index: 15;
            display: none;
        }

        .filter-section.open {
            display: block;
        }

        .search-input {
            width: 100%;
            background: #1E2937;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .search-input:focus {
            outline: none;
            border-color: #C8102E;
        }

        .type-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .type-pill {
            font-size: 9px;
            padding: 1px 7px;
            border-radius: 9999px;
            border: 1px solid #475569;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .type-pill.active {
            background: #C8102E;
            border-color: #C8102E;
        }

        .scrollable-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 7px 6px;
            scrollbar-width: thin;
            scrollbar-color: #475569 #1E2937;
            min-height: 0;
            position: relative;
            z-index: 1;
        }

        .scrollable-list::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable-list::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 3px;
        }

        .pokemon-list-item {
            display: flex;
            align-items: center;
            padding: 11px 10px;
            border-radius: 9px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background 0.06s ease, border-color 0.06s ease;
            border: 2px solid transparent;
            background: #1E2937;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .pokemon-list-item:hover {
            background: #273549;
        }

        .pokemon-list-item.selected {
            background: #334155;
            border-color: #C8102E;
            box-shadow: 0 0 0 3px #C8102E;
        }

        .pokemon-list-item.tapped {
            background: #C8102E !important;
            border-color: white !important;
            transform: scale(0.985);
            transition: none;
        }

        .list-sprite {
            width: 66px;
            height: 66px;
            margin-right: 11px;
            flex-shrink: 0;
            image-rendering: crisp-edges;
        }

        .list-info {
            flex: 1;
            min-width: 0;
        }

        .list-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .list-types {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }

        .footer {
            padding: 7px 11px;
            background: #111827;
            font-size: 8px;
            color: #64748B;
            text-align: center;
            border-top: 1px solid #334155;
            flex-shrink: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 10px;
            pointer-events: auto;
        }
        
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1E2937;
            border-radius: 14px;
            width: 100%;
            max-width: 460px;
            max-height: 88vh;
            overflow-y: auto;
            border: 5px solid #C8102E;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
            pointer-events: auto;
        }
        
        .modal-header {
            background: linear-gradient(#C8102E, #8B0000);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            padding: 0 3px;
        }
        
        .modal-body {
            padding: 14px;
        }
        
        .detail-sprite {
            width: 118px;
            height: 118px;
            margin: 0 auto 8px;
            display: block;
            image-rendering: crisp-edges;
        }
        
        .stats-grid {
            display: grid;
            gap: 4px;
            margin: 8px 0;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        
        .stat-label {
            width: 62px;
            font-size: 10px;
            font-weight: 600;
            color: #CBD5E1;
        }
        
        .stat-bar-container {
            flex: 1;
            background: #334155;
            height: 8px;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .stat-bar {
            height: 100%;
            background: linear-gradient(to right, #C8102E, #EF4444);
        }
        
        .stat-value {
            width: 28px;
            text-align: right;
            font-weight: 700;
            font-size: 10px;
        }
        
        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: #C8102E;
            margin: 10px 0 4px;
            letter-spacing: 0.5px;
        }
        
        .pokedex-entry {
            background: #0F172A;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 9px;
            font-size: 12px;
            line-height: 1.4;
            color: #E2E8F0;
        }
        
        .moves-container {
            background: #0F172A;
            border-radius: 6px;
            padding: 7px;
            font-size: 11px;
            line-height: 1.35;
            max-height: 180px;
            overflow-y: auto;
        }
        
        .effectiveness-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 3px;
        }
        
        .effect-box {
            background: #0F172A;
            border-radius: 6px;
            padding: 7px;
        }
        
        .effect-title {
            font-size: 9px;
            font-weight: 700;
            color: #C8102E;
            margin-bottom: 3px;
        }
        
        .effect-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        
        .effect-pill {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 4px;
            color: white;
        }
        
        .nav-buttons {
            display: flex;
            gap: 7px;
        }
        
        .nav-btn {
            background: #1E2937;
            border: 1px solid #475569;
            color: #CBD5E1;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .nav-btn:hover {
            border-color: #C8102E;
            color: white;
        }

        .invisible-spacer {
            height: 68px;
            opacity: 0;
            pointer-events: none;
            flex-shrink: 0;
        }

        .move-section {
            margin-bottom: 12px;
        }

        .move-section:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
