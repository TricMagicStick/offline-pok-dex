<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POKÉDEX • Offline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(#8B0000, #5C0000);
            color: #F1F5F9;
            min-height: 100vh;
            padding: 8px;
        }
        
        .pokedex-container {
            max-width: 1080px;
            margin: 0 auto;
            background: #111827;
            border: 8px solid #C8102E;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 96vh;
        }
        
        .pokedex-header {
            background: linear-gradient(#C8102E, #8B0000);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 6px solid #5C0000;
            flex-shrink: 0;
        }
        
        .pokedex-header h1 {
            font-family: "Press Start 2P", system-ui;
            font-size: 20px;
            letter-spacing: 2px;
            color: white;
            text-shadow: 3px 3px 0 #5C0000;
        }
        
        .main-content {
            padding: 10px;
            background: #0F172A;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .split-container {
            display: flex;
            flex-direction: row;
            gap: 10px;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        
        @media (max-width: 640px) {
            .split-container {
                flex-direction: column;
                gap: 8px;
            }
        }

        .viewer-panel {
            background: #1E2937;
            border-radius: 12px;
            border: 2px solid #334155;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1 1 45%;
            min-width: 0;
            overflow-y: auto;
            min-height: 185px;
        }

        @media (max-width: 640px) {
            .viewer-panel {
                flex: 0 0 270px;
                min-height: 270px;
                padding: 8px 6px;
            }
        }

        .viewer-sprite {
            width: 148px;
            height: 148px;
            margin: 0 0 2px;
            image-rendering: crisp-edges;
            flex-shrink: 0;
        }

        .viewer-name {
            font-size: 21px;
            font-weight: 700;
            margin-bottom: 2px;
            line-height: 1.05;
        }

        .viewer-types {
            display: flex;
            gap: 5px;
            margin-bottom: 2px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .list-panel {
            background: #1E2937;
            border-radius: 12px;
            border: 2px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1 1 55%;
            min-width: 0;
            position: relative;
        }

        @media (max-width: 640px) {
            .list-panel {
                flex: 1 1 auto;
                min-height: 0;
            }
        }

        .list-header {
            padding: 9px 12px;
            background: #111827;
            font-weight: 600;
            font-size: 12px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-toggle {
            background: #1E2937;
            border: 1px solid #475569;
            color: #CBD5E1;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .filter-toggle:hover {
            border-color: #C8102E;
        }

        .filter-section {
            padding: 7px 11px;
            background: #111827;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            z-index: 15;
            display: none;
        }

        .filter-section.open {
            display: block;
        }

        .search-input {
            width: 100%;
            background: #1E2937;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 10px;
            color: white;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .search-input:focus {
            outline: none;
            border-color: #C8102E;
        }

        .type-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .type-pill {
            font-size: 9px;
            padding: 1px 7px;
            border-radius: 9999px;
            border: 1px solid #475569;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .type-pill.active {
            background: #C8102E;
            border-color: #C8102E;
        }

        .scrollable-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 7px 6px;
            scrollbar-width: thin;
            scrollbar-color: #475569 #1E2937;
            min-height: 0;
            position: relative;
            z-index: 1;
        }

        .scrollable-list::-webkit-scrollbar {
            width: 4px;
        }
        .scrollable-list::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 3px;
        }

        .pokemon-list-item {
            display: flex;
            align-items: center;
            padding: 11px 10px;
            border-radius: 9px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: background 0.06s ease, border-color 0.06s ease;
            border: 2px solid transparent;
            background: #1E2937;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .pokemon-list-item:hover {
            background: #273549;
        }

        .pokemon-list-item.selected {
            background: #334155;
            border-color: #C8102E;
            box-shadow: 0 0 0 3px #C8102E;
        }

        .pokemon-list-item.tapped {
            background: #C8102E !important;
            border-color: white !important;
            transform: scale(0.985);
            transition: none;
        }

        .list-sprite {
            width: 66px;
            height: 66px;
            margin-right: 11px;
            flex-shrink: 0;
            image-rendering: crisp-edges;
        }

        .list-info {
            flex: 1;
            min-width: 0;
        }

        .list-name {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        .list-types {
            display: flex;
            gap: 4px;
            margin-top: 3px;
        }

        .footer {
            padding: 7px 11px;
            background: #111827;
            font-size: 8px;
            color: #64748B;
            text-align: center;
            border-top: 1px solid #334155;
            flex-shrink: 0;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.88);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 10px;
            pointer-events: auto;
        }
        
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1E2937;
            border-radius: 14px;
            width: 100%;
            max-width: 460px;
            max-height: 88vh;
            overflow-y: auto;
            border: 5px solid #C8102E;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
            pointer-events: auto;
        }
        
        .modal-header {
            background: linear-gradient(#C8102E, #8B0000);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            padding: 0 3px;
        }
        
        .modal-body {
            padding: 14px;
        }
        
        .detail-sprite {
            width: 118px;
            height: 118px;
            margin: 0 auto 8px;
            display: block;
            image-rendering: crisp-edges;
        }
        
        .stats-grid {
            display: grid;
            gap: 4px;
            margin: 8px 0;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        
        .stat-label {
            width: 62px;
            font-size: 10px;
            font-weight: 600;
            color: #CBD5E1;
        }
        
        .stat-bar-container {
            flex: 1;
            background: #334155;
            height: 8px;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .stat-bar {
            height: 100%;
            background: linear-gradient(to right, #C8102E, #EF4444);
        }
        
        .stat-value {
            width: 28px;
            text-align: right;
            font-weight: 700;
            font-size: 10px;
        }
        
        .section-title {
            font-size: 10px;
            font-weight: 700;
            color: #C8102E;
            margin: 10px 0 4px;
            letter-spacing: 0.5px;
        }
        
        .pokedex-entry {
            background: #0F172A;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 9px;
            font-size: 12px;
            line-height: 1.4;
            color: #E2E8F0;
        }
        
        .moves-container {
            background: #0F172A;
            border-radius: 6px;
            padding: 7px;
            font-size: 11px;
            line-height: 1.35;
            max-height: 155px;
            overflow-y: auto;
        }
        
        .effectiveness-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 3px;
        }
        
        .effect-box {
            background: #0F172A;
            border-radius: 6px;
            padding: 7px;
        }
        
        .effect-title {
            font-size: 9px;
            font-weight: 700;
            color: #C8102E;
            margin-bottom: 3px;
        }
        
        .effect-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        
        .effect-pill {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 4px;
            color: white;
        }
        
        .nav-buttons {
            display: flex;
            gap: 7px;
        }
        
        .nav-btn {
            background: #1E2937;
            border: 1px solid #475569;
            color: #CBD5E1;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .nav-btn:hover {
            border-color: #C8102E;
            color: white;
        }

        .invisible-spacer {
            height: 68px;
            opacity: 0;
            pointer-events: none;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="pokedex-container">
        <!-- Header -->
        <div class="pokedex-header">
            <div>
                <h1>POKÉDEX</h1>
                <div style="font-size: 8px; opacity: 0.85; margin-top: -2px;">OFFLINE • v1.9.13 • Debug bar removed</div>
            </div>
            <div style="display: flex; gap: 7px; align-items: center;">
                <button id="random-btn" class="nav-btn" style="font-size:10px; padding:4px 9px;">🎲 Random</button>
            </div>
        </div>

        <div class="main-content">
            <div class="split-container">
                
                <!-- VIEWER -->
                <div class="viewer-panel">
                    <img id="viewer-sprite" class="viewer-sprite" 
                         src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" 
                         alt="Bulbasaur">
                    
                    <div id="viewer-name" class="viewer-name">Bulbasaur</div>
                    
                    <div id="viewer-types" class="viewer-types">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <!-- LIST -->
                <div class="list-panel">
                    <div class="list-header">
                        <span>National Pokédex (151)</span>
                        <div style="display: flex; gap: 5px;">
                            <button id="toggle-filter" class="filter-toggle">
                                🔍 Search / Filter
                            </button>
                        </div>
                    </div>
                    
                    <div id="filter-section" class="filter-section">
                        <input type="text" id="search-input" class="search-input" placeholder="Search name or #...">
                        
                        <div class="type-filters" id="type-filters">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                    
                    <div id="pokemon-list" class="scrollable-list">
                        <!-- Populated by JS -->
                    </div>
                </div>

            </div>
        </div>

        <div class="footer">
            Offline Pokédex • v1.9.13 • Debug bar removed
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="nav-buttons">
                    <button id="prev-btn" class="nav-btn">← Prev</button>
                    <button id="next-btn" class="nav-btn">Next →</button>
                </div>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="modal-body">
                <img id="modal-sprite" class="detail-sprite" alt="">
                
                <div id="modal-types" style="display: flex; justify-content: center; gap: 4px; margin-bottom: 6px; flex-wrap: wrap;"></div>
                
                <div>
                    <div class="section-title">ABILITIES</div>
                    <div id="modal-abilities" style="display: flex; flex-wrap: wrap; gap: 3px; font-size: 11px;"></div>
                </div>
                
                <div>
                    <div class="section-title">BASE STATS</div>
                    <div class="stats-grid" id="modal-stats"></div>
                </div>
                
                <div>
                    <div class="section-title">TYPE EFFECTIVENESS</div>
                    <div class="effectiveness-grid" id="modal-effectiveness">
                        <!-- Populated by JS -->
                    </div>
                </div>
                
                <div>
                    <div class="section-title">POKÉDEX ENTRY</div>
                    <div class="pokedex-entry" id="modal-entry"></div>
                </div>
                
                <div>
                    <div class="section-title">LEVEL-UP MOVES</div>
                    <div id="modal-moves" class="moves-container">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

        let currentFilters = { search: '', types: [] };
        let allPokemon = [...pokemonData];
        let currentSelectedPokemon = null;

        function toggleFilterSection() {
            const section = document.getElementById('filter-section');
            if (!section) return;
            section.classList.toggle('open');
        }

        function renderTypeFilters() {
            const container = document.getElementById('type-filters');
            if (!container) return;
            container.innerHTML = '';
            
            const allTypes = [...new Set(allPokemon.flatMap(p => p.types))].sort();
            
            allTypes.forEach(type => {
                const pill = document.createElement('div');
                pill.className = 'type-pill';
                pill.textContent = type;
                pill.style.backgroundColor = typeColors[type] || '#64748B';
                
                pill.addEventListener('click', () => {
                    if (currentFilters.types.includes(type)) {
                        currentFilters.types = currentFilters.types.filter(t => t !== type);
                        pill.classList.remove('active');
                    } else {
                        currentFilters.types.push(type);
                        pill.classList.add('active');
                    }
                    filterAndRender();
                });
                
                container.appendChild(pill);
            });
        }

        function filterAndRender() {
            let filtered = allPokemon;
            
            const searchTerm = currentFilters.search.toLowerCase().trim();
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) || 
                    p.national_dex.toString().includes(searchTerm)
                );
            }
            
            if (currentFilters.types.length > 0) {
                filtered = filtered.filter(p => 
                    currentFilters.types.every(t => p.types.includes(t))
                );
            }
            
            renderList(filtered);
        }

        function updateViewer(pokemon) {
            if (!pokemon) return;
            currentSelectedPokemon = pokemon;
            
            const spriteEl = document.getElementById('viewer-sprite');
            if (spriteEl) {
                spriteEl.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png`;
                spriteEl.alt = pokemon.name;
            }
            
            const nameEl = document.getElementById('viewer-name');
            if (nameEl) nameEl.textContent = pokemon.name;
            
            const typesContainer = document.getElementById('viewer-types');
            if (typesContainer) {
                typesContainer.innerHTML = pokemon.types.map(type => 
                    `<span style="background-color: ${typeColors[type] || '#64748B'}; color: white; padding: 2px 9px; border-radius: 5px; font-size: 11px;">${type}</span>`
                ).join('');
            }
            
            document.querySelectorAll('.pokemon-list-item').forEach(el => {
                el.classList.remove('selected');
                if (parseInt(el.dataset.dex) === pokemon.national_dex) {
                    el.classList.add('selected');
                }
            });
        }

        function renderList(pokemonList) {
            const container = document.getElementById('pokemon-list');
            if (!container) return;
            container.innerHTML = '';
            
            if (!pokemonList || pokemonList.length === 0) {
                container.innerHTML = '<div style="padding: 20px 10px; text-align: center; color: #64748B; font-size: 11px;">No Pokémon found.</div>';
                return;
            }
            
            // 2 invisible items at the top
            for (let i = 0; i < 2; i++) {
                const spacer = document.createElement('div');
                spacer.className = 'pokemon-list-item invisible-spacer';
                spacer.style.height = '68px';
                spacer.style.opacity = '0';
                spacer.style.pointerEvents = 'none';
                container.appendChild(spacer);
            }
            
            pokemonList.forEach(pokemon => {
                const item = document.createElement('div');
                item.className = 'pokemon-list-item';
                item.dataset.dex = pokemon.national_dex;
                
                let typesHTML = pokemon.types.map(type => 
                    `<span style="background-color: ${typeColors[type] || '#64748B'}; color: white; padding: 0 5px; border-radius: 3px; font-size: 9px;">${type}</span>`
                ).join('');
                
                item.innerHTML = `
                    <img class="list-sprite" 
                         src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png" 
                         alt="${pokemon.name}"
                         onerror="this.style.display='none'">
                    <div class="list-info">
                        <div style="display: flex; align-items: center; gap: 5px;">
                            <span style="font-family: 'Press Start 2P', system-ui; font-size: 9px; color: #64748B;">#${String(pokemon.national_dex).padStart(3, '0')}</span>
                            <span class="list-name">${pokemon.name}</span>
                        </div>
                        <div class="list-types" style="margin-top: 3px;">${typesHTML}</div>
                    </div>
                `;
                
                let touchMoved = false;
                
                item.addEventListener('touchstart', function(e) {
                    touchStartY = e.touches[0].clientY;
                    touchStartTime = Date.now();
                    touchMoved = false;
                }, { passive: true });
                
                item.addEventListener('touchmove', function(e) {
                    const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
                    if (deltaY > 12) touchMoved = true;
                }, { passive: true });
                
                const handleTap = function(e) {
                    const timeDiff = Date.now() - touchStartTime;
                    if (touchMoved || timeDiff > 450) return;
                    
                    if (e) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                    }
                    
                    item.classList.add('tapped');
                    setTimeout(() => item.classList.remove('tapped'), 220);
                    
                    updateViewer(pokemon);
                    
                    setTimeout(() => {
                        showDetail(pokemon);
                    }, 50);
                };
                
                item.addEventListener('click', handleTap, { passive: false });
                item.addEventListener('touchend', handleTap, { passive: false });
                item.addEventListener('pointerup', handleTap, { passive: false });
                
                container.appendChild(item);
            });
            
            // 3 invisible items at the bottom
            for (let i = 0; i < 3; i++) {
                const spacer = document.createElement('div');
                spacer.className = 'pokemon-list-item invisible-spacer';
                spacer.style.height = '68px';
                spacer.style.opacity = '0';
                spacer.style.pointerEvents = 'none';
                container.appendChild(spacer);
            }
            
            if (currentSelectedPokemon) {
                const selectedEl = container.querySelector(`[data-dex="${currentSelectedPokemon.national_dex}"]`);
                if (selectedEl) selectedEl.classList.add('selected');
            }
        }

        function getTypeEffectiveness(types) {
            let weak = new Set();
            let resist = new Set();
            let immune = new Set();
            
            types.forEach(type => {
                const eff = typeEffectiveness[type];
                if (!eff) return;
                
                eff.weak.forEach(t => weak.add(t));
                eff.resist.forEach(t => resist.add(t));
                eff.immune.forEach(t => immune.add(t));
            });
            
            immune.forEach(t => { resist.delete(t); weak.delete(t); });
            resist.forEach(t => weak.delete(t));
            
            return {
                weak: Array.from(weak),
                resist: Array.from(resist),
                immune: Array.from(immune)
            };
        }

                            : '<span style="color:#64748B; font-size:11px;">None</span>';
                        box.innerHTML = `<div class="effect-title">${title}</div><div class="effect-pills">${pills}</div>`;
                        return box;
                    };
                    effContainer.appendChild(createEffectBox('WEAK TO', eff.weak));
                    effContainer.appendChild(createEffectBox('RESISTS', eff.resist));
                    effContainer.appendChild(createEffectBox('IMMUNE TO', eff.immune));

                const movesContainer = document.getElementById('modal-moves');
                if (movesContainer) {
                    movesContainer.innerHTML = (pokemon.moves && pokemon.moves.level_up && pokemon.moves.level_up.length > 0)
                        ? pokemon.moves.level_up.map(m => `<span style="display:inline-block; background:#1E2937; margin:2px 3px; padding:2px 7px; border-radius:4px; font-size:11px;">Lv${m.level} ${m.name}</span>`).join('')
                        : '<span style="color:#64748B; font-size:11px;">No move data yet.</span>';
                }
                
                const entryContainer = document.getElementById('modal-entry');
                if (entryContainer) {
                    entryContainer.textContent = pokemon.entry || 'Pokédex entry coming soon.';
                }
                
                document.body.style.overflow = 'hidden';
                modal.style.display = 'flex';
                void modal.offsetHeight;
                modal.classList.add('active');
            } catch (err) {
                console.error(err);
            }
        }

        function navigateModal(direction) {
            const modal = document.getElementById('detail-modal');
            const currentDex = parseInt(modal.dataset.currentDex);
            if (!currentDex) return;
            
            let currentIndex = allPokemon.findIndex(p => p.national_dex === currentDex);
            if (currentIndex === -1) return;
            
            let newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = allPokemon.length - 1;
            if (newIndex >= allPokemon.length) newIndex = 0;
            
            const newPokemon = allPokemon[newIndex];
            showDetail(newPokemon);
            updateViewer(newPokemon);
        }

        function showRandomPokemon() {
            const randomIndex = Math.floor(Math.random() * allPokemon.length);
            const randomPokemon = allPokemon[randomIndex];
            updateViewer(randomPokemon);
            showDetail(randomPokemon);
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('active');
            modal.style.display = 'none';
            document.body.style.overflow = '';
        }

        function init() {
            const toggleBtn = document.getElementById('toggle-filter');
            if (toggleBtn) toggleBtn.addEventListener('click', toggleFilterSection);
            
            const searchInput = document.getElementById('search-input');
            if (searchInput) searchInput.addEventListener('input', e => {
                currentFilters.search = e.target.value;
                filterAndRender();
            });
            
            const randomBtn = document.getElementById('random-btn');
            if (randomBtn) randomBtn.addEventListener('click', showRandomPokemon);
            
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            if (prevBtn) prevBtn.addEventListener('click', () => navigateModal(-1));
            if (nextBtn) nextBtn.addEventListener('click', () => navigateModal(1));
            
            const modal = document.getElementById('detail-modal');
            if (modal) {
                modal.addEventListener('click', e => { if (e.target.id === 'detail-modal') closeModal(); });
                modal.addEventListener('touchend', e => {
                    if (e.target.id === 'detail-modal') { e.preventDefault(); closeModal(); }
                }, { passive: false });
            }
            
            renderTypeFilters();
            
            setTimeout(() => {
                filterAndRender();
                const bulbasaur = allPokemon.find(p => p.national_dex === 1);
                if (bulbasaur) updateViewer(bulbasaur);
            }, 80);
            
            const listContainer = document.getElementById('pokemon-list');
            if (listContainer) {
                let rafId = null;
                listContainer.addEventListener('scroll', () => {
                    if (rafId) cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(() => {
                        const items = listContainer.querySelectorAll('.pokemon-list-item');
                        if (items.length === 0) return;
                        const containerRect = listContainer.getBoundingClientRect();
                        const centerY = containerRect.top + containerRect.height / 2;
                        let closest = null;
                        let closestDist = Infinity;
                        items.forEach(el => {
                            const r = el.getBoundingClientRect();
                            const dist = Math.abs((r.top + r.height / 2) - centerY);
                            if (dist < closestDist) { closestDist = dist; closest = el;
                            }
                        });
                        if (closest) {
                            const dex = parseInt(closest.dataset.dex);
                            const p = allPokemon.find(x => x.national_dex === dex);
                            if (p && p !== currentSelectedPokemon) {
                                updateViewer(p);
                            }
                        }
                    });
                }, { passive: true });
            }
            
            console.log('%c[v1.9.13] Debug bar removed for good.', 'color:#22C55E');
        }

        window.onload = init;
    </script>
</body>
</html>
