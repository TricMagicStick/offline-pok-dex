<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Pokédex • Gen 1</title>
  <link rel="stylesheet" href="./css/pokedex.css">
  <link rel="manifest" href="./manifest.json">
  <style>
    .pokemon-list-item { transition: background 0.06s ease, border-color 0.06s ease; }
    .modal { transition: opacity 0.1s ease; }
    .list-cursor-zone { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); height: 72px; border: none; background: transparent; pointer-events: none; z-index: 10; border-radius: 4px; }

    /* Enhanced detail modal polish */
    .modal-content { max-width: 480px; }
    .modal-body { padding: 20px 18px; }
    .detail-sprite { width: 130px; height: 130px; margin: 0 auto 12px; }
    .section-title { font-size: 11px; font-weight: 700; color: #C8102E; margin: 14px 0 6px; letter-spacing: 0.5px; }
    .stat-row { gap: 8px; }
    .stat-bar-container { height: 9px; }
    .stat-bar { background: linear-gradient(to right, #C8102E, #EF4444); }
    .moves-container { background: #0F172A; border-radius: 8px; padding: 10px; }
    .move-chip { display: inline-block; background: #1E2937; padding: 3px 9px; border-radius: 6px; margin: 2px 4px 2px 0; font-size: 12px; }
  </style>
</head>
<body>
  <div class="pokedex-container">
    <div class="pokedex-header">
      <h1>POKÉDEX</h1>
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:10px; opacity:0.7;">Gen 1 • Offline</span>
      </div>
    </div>

    <div class="main-content">
      <div class="split-container">
        <div class="list-panel" id="list-panel">
          <div class="list-header">
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-weight:700; font-size:13px;">KANTO</span>
              <span id="pokemon-count" style="font-size:11px; color:#64748B;"></span>
            </div>
            <button class="filter-toggle" onclick="toggleFilters()">
              <span>Filter</span>
            </button>
          </div>

          <div style="padding:8px 11px 0;">
            <input type="text" id="search-input" class="search-input" placeholder="Search name or #..." oninput="filterList()">
          </div>

          <div id="filter-section" class="filter-section">
            <div class="type-filters" id="type-filters"></div>
          </div>

          <div id="pokemon-list" class="scrollable-list"></div>
          <div class="list-cursor-zone" id="list-cursor-zone"></div>
        </div>

        <div class="viewer-panel" id="viewer-panel">
          <div id="viewer-content">
            <div style="padding:40px 20px; color:#64748B; font-size:12px; text-align:center;">
              Select a Pokémon from the list<br>
              to see details
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      Fully offline • Data from PokéAPI + Gen 1 moves • v3.8 detail modal polish
    </div>
  </div>

  <div id="detail-modal" class="modal" onclick="if (event.target.id === 'detail-modal') closeModal()">
    <div class="modal-content" onclick="event.stopImmediatePropagation()">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <span id="modal-dex" style="font-family:monospace; font-size:13px; opacity:0.85;"></span>
          <span id="modal-name" style="font-weight:700; font-size:18px;"></span>
        </div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>

      <div class="modal-body">
        <img id="modal-sprite" class="detail-sprite" alt="Pokemon sprite">
        <div id="modal-types" class="viewer-types" style="justify-content:center; margin-bottom:10px;"></div>

        <div style="margin:8px 0 4px;">
          <div class="section-title">ABILITIES</div>
          <div id="modal-abilities" style="font-size:13px; color:#CBD5E1; line-height:1.4;"></div>
        </div>

        <div>
          <div class="section-title">BASE STATS</div>
          <div id="modal-stats" class="stats-grid"></div>
        </div>

        <div>
          <div class="section-title">POKÉDEX ENTRY</div>
          <div id="modal-entry" class="pokedex-entry"></div>
        </div>

        <div>
          <div class="section-title">MOVES</div>
          <div id="modal-moves" class="moves-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/data.js"></script>
  <script>
    let filteredPokemon = [];
    let currentModalGeneration = "1";
    let currentSelectedPokemon = null;
    let activeTypeFilters = new Set();
    let liveSelectionEnabled = true;
    let scrollUpdateScheduled = false;

    function isMobile() { return window.matchMedia('(max-width: 640px)').matches; }

    function highlightCurrentSelection() {
      if (!currentSelectedPokemon) return;
      document.querySelectorAll('.pokemon-list-item').forEach(el => {
        el.classList.toggle('selected', parseInt(el.dataset.dex) === currentSelectedPokemon.national_dex);
      });
    }

    function getPokemonUnderCursor() {
      const list = document.getElementById('pokemon-list');
      if (!list || filteredPokemon.length === 0) return null;
      const listRect = list.getBoundingClientRect();
      const cursorCenterY = listRect.top + (listRect.height / 2);
      let closestPokemon = null;
      let closestDistance = Infinity;
      document.querySelectorAll('.pokemon-list-item').forEach(item => {
        const itemRect = item.getBoundingClientRect();
        const itemCenterY = itemRect.top + (itemRect.height / 2);
        const distance = Math.abs(itemCenterY - cursorCenterY);
        if (distance < closestDistance) {
          closestDistance = distance;
          const dex = parseInt(item.dataset.dex);
          closestPokemon = filteredPokemon.find(p => p.national_dex === dex);
        }
      });
      return closestPokemon;
    }

    function updateLiveSelectionFromScroll() {
      if (!liveSelectionEnabled || document.getElementById('detail-modal').classList.contains('active')) return;
      const pokemon = getPokemonUnderCursor();
      if (!pokemon) return;
      if (!currentSelectedPokemon || currentSelectedPokemon.national_dex !== pokemon.national_dex) {
        currentSelectedPokemon = pokemon;
        updateViewerPanel(pokemon);
        highlightCurrentSelection();
      }
    }

    function scheduleLiveSelectionUpdate() {
      if (scrollUpdateScheduled) return;
      scrollUpdateScheduled = true;
      requestAnimationFrame(() => { updateLiveSelectionFromScroll(); scrollUpdateScheduled = false; });
    }

    function renderList() {
      const container = document.getElementById('pokemon-list');
      container.innerHTML = '';
      if (filteredPokemon.length === 0) {
        container.innerHTML = `<div style="padding:20px; text-align:center; color:#64748B;">No Pokémon found</div>`;
        return;
      }
      filteredPokemon.forEach(pokemon => {
        const div = document.createElement('div');
        div.className = 'pokemon-list-item';
        div.dataset.dex = pokemon.national_dex;
        div.innerHTML = `
          <img class="list-sprite" src="${pokemon.sprite || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png`}" alt="${pokemon.name}">
          <div class="list-info">
            <div style="display:flex; align-items:center; gap:6px;">
              <span style="font-family:monospace; font-size:11px; color:#64748B; width:32px;">#${String(pokemon.national_dex).padStart(3, '0')}</span>
              <span class="list-name">${pokemon.name}</span>
            </div>
            <div class="list-types">${pokemon.types.map(t => `<span class="type-pill" style="background:#334155; font-size:9px; padding:1px 6px; border-radius:9999px;">${t}</span>`).join('')}</div>
          </div>
        `;
        div.onclick = () => selectPokemon(pokemon, true);
        container.appendChild(div);
      });
      attachLiveSelectorListener();
    }

    let liveSelectorListenerAttached = false;
    function attachLiveSelectorListener() {
      const list = document.getElementById('pokemon-list');
      if (!list || liveSelectorListenerAttached) return;
      list.addEventListener('scroll', () => { scheduleLiveSelectionUpdate(); }, { passive: true });
      setTimeout(() => {
        if (liveSelectionEnabled && filteredPokemon.length > 0 && !currentSelectedPokemon) {
          const first = filteredPokemon[0];
          currentSelectedPokemon = first;
          updateViewerPanel(first);
          highlightCurrentSelection();
        }
      }, 150);
      liveSelectorListenerAttached = true;
    }

    function filterList() {
      const term = document.getElementById('search-input').value.toLowerCase().trim();
      filteredPokemon = pokemonData.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(term) || String(p.national_dex).includes(term);
        const matchesType = activeTypeFilters.size === 0 || p.types.some(t => activeTypeFilters.has(t));
        return matchesSearch && matchesType;
      });
      renderList();
      setTimeout(() => {
        if (liveSelectionEnabled && filteredPokemon.length > 0) {
          const target = currentSelectedPokemon && filteredPokemon.some(p => p.national_dex === currentSelectedPokemon.national_dex) ? currentSelectedPokemon : filteredPokemon[0];
          currentSelectedPokemon = target;
          updateViewerPanel(target);
          highlightCurrentSelection();
        }
      }, 50);
    }

    function toggleFilters() {
      document.getElementById('filter-section').classList.toggle('open');
    }

    function selectPokemon(pokemon, userInitiated = false) {
      currentSelectedPokemon = pokemon;
      document.querySelectorAll('.pokemon-list-item').forEach(el => el.classList.remove('selected'));
      const listItem = document.querySelector(`.pokemon-list-item[data-dex="${pokemon.national_dex}"]`);
      if (listItem) {
        listItem.classList.add('selected');
        if (userInitiated) listItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      updateViewerPanel(pokemon);
      if (!isMobile() && userInitiated) showDetail(pokemon);
    }

    function updateViewerPanel(pokemon) {
      const panel = document.getElementById('viewer-content');
      panel.innerHTML = `
        <img class="viewer-sprite" src="${pokemon.sprite || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png`}" alt="${pokemon.name}">
        <div class="viewer-name">${pokemon.name}</div>
        <div class="viewer-types">${pokemon.types.map(t => `<span class="type-pill" style="background:#334155">${t}</span>`).join('')}</div>
        <div style="margin-top:8px; font-size:11px; color:#94A3B8;">#${String(pokemon.national_dex).padStart(3,'0')}</div>
      `;
      const detailsBtn = document.createElement('button');
      detailsBtn.textContent = 'Full details & moves →';
      detailsBtn.className = 'nav-btn';
      detailsBtn.style.marginTop = '12px';
      detailsBtn.style.fontSize = '11px';
      detailsBtn.onclick = () => { if (currentSelectedPokemon) showDetail(currentSelectedPokemon); };
      panel.appendChild(detailsBtn);
    }

    function showDetail(pokemon, gen = currentModalGeneration) {
      currentSelectedPokemon = pokemon;
      currentModalGeneration = gen;

      document.getElementById('modal-dex').textContent = `#${String(pokemon.national_dex).padStart(3, '0')}`;
      document.getElementById('modal-name').textContent = pokemon.name;

      const sprite = document.getElementById('modal-sprite');
      sprite.src = pokemon.sprite || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.national_dex}.png`;
      sprite.alt = pokemon.name;

      document.getElementById('modal-types').innerHTML = pokemon.types.map(t => `<span class="type-pill" style="background:#334155; padding:2px 9px;">${t}</span>`).join('');

      document.getElementById('modal-abilities').innerHTML = pokemon.abilities ? pokemon.abilities.join(' • ') : '—';

      const statsContainer = document.getElementById('modal-stats');
      statsContainer.innerHTML = '';
      const statNames = ['hp', 'attack', 'defense', 'special_attack', 'special_defense', 'speed'];
      const statLabels = ['HP', 'ATK', 'DEF', 'SpA', 'SpD', 'SPE'];

      statNames.forEach((stat, i) => {
        const value = pokemon.base_stats ? (pokemon.base_stats[stat] || 0) : 0;
        const row = document.createElement('div');
        row.className = 'stat-row';
        row.innerHTML = `
          <div class="stat-label">${statLabels[i]}</div>
          <div class="stat-bar-container"><div class="stat-bar" style="width: ${Math.min(value, 255) / 2.55}%;"></div></div>
          <div class="stat-value">${value}</div>
        `;
        statsContainer.appendChild(row);
      });

      document.getElementById('modal-entry').textContent = pokemon.entry || 'No entry available.';

      const movesContainer = document.getElementById('modal-moves');
      movesContainer.innerHTML = '';

      if (pokemon.moves) {
        if (pokemon.moves.level_up && pokemon.moves.level_up.length > 0) {
          const section = document.createElement('div');
          section.className = 'move-section';
          section.innerHTML = `<div style="font-weight:600; color:#C8102E; font-size:10px; margin-bottom:4px;">LEVEL-UP</div>`;
          section.innerHTML += pokemon.moves.level_up.map(m => 
            `<span class="move-chip">Lv${m.level} ${m.name}</span>`
          ).join('');
          movesContainer.appendChild(section);
        }
        if (pokemon.moves.tm && pokemon.moves.tm.length > 0) {
          const section = document.createElement('div');
          section.className = 'move-section';
          section.innerHTML = `<div style="font-weight:600; color:#C8102E; font-size:10px; margin-bottom:4px; margin-top:8px;">TM / HM</div>`;
          section.innerHTML += pokemon.moves.tm.map(name => 
            `<span class="move-chip">${name}</span>`
          ).join('');
          movesContainer.appendChild(section);
        }
      } else {
        movesContainer.innerHTML = '<div style="color:#64748B; font-size:12px;">No move data available</div>';
      }

      document.getElementById('detail-modal').classList.add('active');
    }

    function closeModal() { document.getElementById('detail-modal').classList.remove('active'); }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('detail-modal');
        if (modal.classList.contains('active')) closeModal();
      }
    });

    function init() {
      pokemonData = window.pokemonData || [];
      if (!pokemonData || pokemonData.length < 3) { pokemonData = []; }
      filteredPokemon = [...pokemonData];
      renderList();
      document.getElementById('pokemon-count').textContent = `${pokemonData.length} Pokémon`;

      const allTypes = new Set();
      pokemonData.forEach(p => p.types.forEach(t => allTypes.add(t)));
      const typeContainer = document.getElementById('type-filters');
      allTypes.forEach(type => {
        const pill = document.createElement('span');
        pill.className = 'type-pill';
        pill.textContent = type;
        pill.onclick = () => {
          if (activeTypeFilters.has(type)) { activeTypeFilters.delete(type); pill.classList.remove('active'); }
          else { activeTypeFilters.add(type); pill.classList.add('active'); }
          filterList();
        };
        typeContainer.appendChild(pill);
      });

      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }

      if (pokemonData.length > 0) {
        setTimeout(() => {
          currentSelectedPokemon = pokemonData[0];
          updateViewerPanel(pokemonData[0]);
          highlightCurrentSelection();
        }, 200);
      }
      console.log('%c[ Pokédex ] v3.8 - Detail modal polish', 'color:#22c55e');
    }

    init();
  </script>
</body>
</html>
